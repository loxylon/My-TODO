name: Signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version in app/build.gradle, e.g. v1.0.1'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore original signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TODO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Add the original signing key to repository Actions secrets; see README.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and sign
        env:
          TODO_KEYSTORE: ${{ runner.temp }}/release.jks
          TODO_STORE_PASSWORD: ${{ secrets.TODO_STORE_PASSWORD }}
          TODO_KEY_PASSWORD: ${{ secrets.TODO_KEY_PASSWORD }}
        run: bash scripts/build-release.sh
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test "$RELEASE_TAG" = "v$VERSION"
          gh release create "$RELEASE_TAG" dist/My-TODO.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "My TODO $VERSION" --generate-notes
