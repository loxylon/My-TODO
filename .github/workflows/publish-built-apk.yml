name: Publish verified APK
on:
  push:
    branches: [main]
    paths: ['release/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Verify release checksum and original signer
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs My-TODO.apk > signature.txt
          cat signature.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: 0b0c76696ae7a62cf28b58ea34ed790d3380c1f48e45ba1b066975e637ed17ee' signature.txt
          VERSION=$(cat VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging My-TODO.apk > package.txt
          grep -F "package: name='dev.loxylon.todo'" package.txt
          grep -F "versionName='$VERSION'" package.txt
      - name: Upload signed APK to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat release/VERSION)
          gh release upload "v$VERSION" release/My-TODO.apk release/SHA256SUMS.txt --clobber
