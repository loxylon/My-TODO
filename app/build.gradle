plugins { id 'com.android.application' }

android {
    namespace 'dev.loxylon.todo'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.loxylon.todo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (System.getenv('TODO_KEYSTORE')) {
                storeFile file(System.getenv('TODO_KEYSTORE'))
                storePassword System.getenv('TODO_STORE_PASSWORD')
                keyAlias 'mytodo'
                keyPassword System.getenv('TODO_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
