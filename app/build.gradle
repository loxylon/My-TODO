plugins { id 'com.android.application' }

android {
    namespace 'dev.loxylon.todo'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.loxylon.todo'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }
    signingConfigs {
        release {
            if (System.getenv('TODO_KEYSTORE')) {
                storeFile file(System.getenv('TODO_KEYSTORE'))
                storePassword System.getenv('TODO_STORE_PASSWORD')
                keyAlias 'mytodo'
                keyPassword System.getenv('TODO_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { test.resources.srcDir '../tests/fixtures' }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            def testUserDir = new File(gradle.gradleUserHomeDir, 'android-test-user')
            systemProperty 'user.home', testUserDir.absolutePath
            doFirst { testUserDir.mkdirs() }
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'maven.repo.local', new File(gradle.gradleUserHomeDir, 'robolectric-maven').absolutePath
            ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort','javax.net.ssl.trustStore'].each { key ->
                if (System.getProperty(key)) systemProperty key, System.getProperty(key)
            }
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
